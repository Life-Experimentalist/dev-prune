    <!-- Runs before the first paint, which is the whole point: the prerendered HTML
         is theme-agnostic, so the palette has to be resolved here or the page would
         flash the default dark and then repaint.

         `.js` marks the document so entrance animations only apply where JS can
         finish them — without it, a no-JS visitor or a crawler is served hidden
         content. A no-JS visitor also keeps the dark default, since nothing can
         read their stored choice or their `prefers-color-scheme`. -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        var choice = 'system';
        try {
          choice = localStorage.getItem('devprune-theme') || 'system';
        } catch (e) {
          /* private mode, or storage disabled — fall through to system */
        }
        if (choice !== 'light' && choice !== 'dark') choice = 'system';
        var resolved = choice;
        if (choice === 'system') {
          var prefersLight =
            !!window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches;
          resolved = prefersLight ? 'light' : 'dark';
        }
        root.dataset.themeChoice = choice;
        root.dataset.theme = resolved;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', resolved === 'light' ? '#ffffff' : '#0b0f17');
      })();
    </script>
