name: Release

on:
  push:
    tags:
      # Not `v*`: the VS Code extension tags as `vscode-v<version>` and that matches
      # `v*` too. Requiring a digit keeps each tag starting exactly one workflow.
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The asset names below are a contract with scripts/install.sh and scripts/install.ps1,
  # which construct the download URL as:
  #   dev-prune-v<version>-<os>-<arch>.<tar.gz|zip>
  # and refuse to install without the matching .sha256 sidecar. Renaming anything here
  # breaks every one-line install until the scripts are changed to match.
  build:
    name: ${{ matrix.os_name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, not gnu, and deliberately so. A glibc build carries a floor — it
          # refuses to start on any distribution older than the runner that produced
          # it, and does not run on Alpine or anything else musl-based at all. A
          # statically linked musl binary has no floor and no libc dependency, so one
          # asset per architecture covers every Linux distribution. Nothing here links
          # OpenSSL (`ureq` is built on rustls with bundled roots), so static linking
          # costs nothing.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            os_name: linux
            arch: x64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            os_name: linux
            arch: arm64
          - target: x86_64-apple-darwin
            runner: macos-latest
            os_name: darwin
            arch: x64
          - target: aarch64-apple-darwin
            runner: macos-latest
            os_name: darwin
            arch: arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os_name: windows
            arch: x64
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            os_name: windows
            arch: arm64
          # The only 32-bit target published, and only because Windows is the only
          # platform where 32-bit is still something people run: locked-down corporate
          # images, industrial control machines and the odd Atom netbook. There is no
          # 32-bit Linux or macOS build — 32-bit macOS cannot run at all since Catalina,
          # and i686 Linux would need a cross musl toolchain to serve a desktop
          # population that has effectively gone. This one is a plain rustup target on
          # the same x64 runner, so it costs one more build and nothing else.
          - target: i686-pc-windows-msvc
            runner: windows-latest
            os_name: windows
            arch: x86

    steps:
      # Explicitly the tag. On a `workflow_dispatch` run the default checkout is the
      # branch the workflow was launched from, so without this the job would build
      # `main` and ship it under the tag's name.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      # Before the build, not after: a mismatch fails all seven matrix jobs, and there is
      # no reason to spend seven release builds discovering it. A tag that does not match
      # Cargo.toml ships a binary whose `--version` lies and whose release check compares
      # against the wrong value.
      - name: Verify Cargo.toml version matches the tag
        shell: bash
        run: |
          crate_version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$crate_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "Cargo.toml is $crate_version but the tag is ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      # Same reasoning, one step later: the release body comes out of CHANGELOG.md, so
      # a missing section should stop the release before seven builds run, not after.
      - name: Verify CHANGELOG.md documents this version
        shell: bash
        run: sh scripts/changelog-section.sh "${{ steps.version.outputs.version }}" > /dev/null

      # The install scripts resolve the latest release dynamically but each pins a
      # fallback for offline mirrors and rate-limited CI, and the site prints the
      # version in two places. All four are written by hand and none of them fails
      # visibly when stale. The step above already established Cargo.toml == tag, so
      # checking these against Cargo.toml checks them against the tag.
      - name: Verify the install scripts and site name this version
        shell: bash
        run: sh scripts/check-version.sh

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      # `ring`, the crypto backend under rustls, compiles C. Against musl it needs
      # `musl-gcc`, which is not on the runner image by default.
      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # A Linux asset that turns out to be dynamically linked would still work on the
      # runner and fail on Alpine, which is exactly the bug this target exists to
      # prevent — so prove it before publishing rather than after.
      - name: Verify the Linux binary is static
        if: endsWith(matrix.target, '-musl')
        run: |
          bin="target/${{ matrix.target }}/release/dev-prune"
          if file "$bin" | grep -q "dynamically linked"; then
            file "$bin" >&2
            echo "expected a statically linked binary" >&2
            exit 1
          fi
          file "$bin"

      - name: Package (unix)
        if: matrix.os_name != 'windows'
        shell: bash
        run: |
          asset="dev-prune-v${{ steps.version.outputs.version }}-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz"
          tar -czf "$asset" -C "target/${{ matrix.target }}/release" dev-prune
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi

          # The same binary again, uncompressed, for `devp update --install`. Self-update
          # needs one download and one hash check; unpacking a tarball inside the binary
          # would mean compiling gzip and tar into it purely to undo what this step did.
          # The archive stays because it is what a human downloads from the release page.
          raw="dev-prune-v${{ steps.version.outputs.version }}-${{ matrix.os_name }}-${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/dev-prune" "$raw"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$raw" > "$raw.sha256"
          else
            shasum -a 256 "$raw" > "$raw.sha256"
          fi

      - name: Package (windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          # Both names go in the archive, as two real files.
          #
          # WinGet installs a portable package by putting each declared nested file on
          # PATH, and it refuses two entries pointing at the same `RelativeFilePath`. So
          # `devp` can only be a WinGet command if `devp.exe` is genuinely in the zip —
          # and the alternative, letting the binary copy itself on first run, is what
          # earned this package a `Validation-Executable-Error` and a
          # `Validation-Defender-Error` on microsoft/winget-pkgs#422665. It also orphaned
          # the copy on every upgrade, because WinGet replaces its package directory
          # whole. Four megabytes of duplicate is the cheap half of that trade.
          #
          # Byte-identical, and that is load-bearing: one SHA-256 means one reputation
          # record. VirusTotal, SmartScreen and every vendor that keys off a file hash
          # treat the two names as the same file, so the download count that clears a
          # new release accrues once instead of twice, and a single false-positive
          # dispute covers both.
          #
          # `devp` is a `[[bin]]` target in Cargo.toml, so `cargo install` produces both
          # names - but that path compiles two distinct images and lands two distinct
          # hashes. What ships here does not: both entries are copies of the one
          # `dev-prune.exe` this job built, and `target/release/devp.exe` is deliberately
          # never packaged. Do not "simplify" this into copying each target to its own
          # name; the identical bytes are the point.
          $stage = New-Item -ItemType Directory -Force -Path "stage-${{ matrix.arch }}"
          Copy-Item "target/${{ matrix.target }}/release/dev-prune.exe" (Join-Path $stage 'dev-prune.exe')
          Copy-Item "target/${{ matrix.target }}/release/dev-prune.exe" (Join-Path $stage 'devp.exe')
          # The windowless build, which the scheduled task runs so it cannot flash a
          # console at whoever is logged in. It is a `[[bin]]` target, not something the
          # installed binary generates: a program that rewrites its own image and writes
          # the result out under a second name is a dropper by every behavioural
          # definition, and that is what got the 1.5.0 zip quarantined. WinGet exposes
          # only the `NestedInstallerFiles` the manifest declares, so shipping it here
          # does not put a third command on PATH.
          Copy-Item "target/${{ matrix.target }}/release/devpw.exe" (Join-Path $stage 'devpw.exe')
          $asset = "dev-prune-v${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $asset
          $hash = (Get-FileHash -Path $asset -Algorithm SHA256).Hash.ToLower()
          # Two spaces: the sha256sum format the install scripts parse.
          "$hash  $asset" | Out-File -FilePath "$asset.sha256" -Encoding ascii -NoNewline

          # Uncompressed twin for `devp update --install` — see the unix step for why.
          $raw = "dev-prune-v${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/dev-prune.exe" $raw
          $rawHash = (Get-FileHash -Path $raw -Algorithm SHA256).Hash.ToLower()
          "$rawHash  $raw" | Out-File -FilePath "$raw.sha256" -Encoding ascii -NoNewline

          # The digest of each file *inside* the zip, which is the only one an antivirus
          # ever sees. The sidecars above cover the archive, and an archive's hash stops
          # meaning anything the moment it is unpacked - so until this existed there was
          # no published answer to "is the devpw.exe on my disk the one you built?".
          #
          # `devpw.exe` is the file that needed it most. It is the binary the scheduled
          # task runs, so it is the one a behavioural scanner meets first, and being a
          # separate `[[bin]]` target its digest legitimately differs from the other two
          # - which is indistinguishable from tampering with nothing to compare against.
          # `dev-prune.exe` and `devp.exe` appear here too, and their matching digests
          # are themselves the evidence that the copy above did what it claims.
          #
          # sha256sum format, so `sha256sum -c` in the unpacked directory verifies all
          # three. Not attested, for the same reason no sidecar is: it is a checksum of
          # an already-attested file.
          $contents = "dev-prune-v${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}.zip.contents.sha256"
          $lines = Get-ChildItem -Path $stage -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          # Written with LF, not `Out-File`. The only thing that reads this file is
          # `sha256sum -c`, and coreutils treats the CRLF a Windows runner would emit as
          # part of the filename - so every line fails to match a file that is right there.
          [IO.File]::WriteAllText((Join-Path $PWD $contents), (($lines -join "`n") + "`n"))

      - uses: actions/upload-artifact@v7
        with:
          name: dev-prune-${{ matrix.os_name }}-${{ matrix.arch }}
          path: |
            dev-prune-v*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    # A job-level block replaces the workflow-level grant rather than adding to it, so
    # `contents: write` has to be repeated here or the release upload loses it.
    permissions:
      contents: write
      # Both are required by actions/attest-build-provenance: the OIDC token identifies
      # this workflow to Sigstore, and the attestation is then written to the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Resolve version from tag
        id: version
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist

      # A `.sha256` sidecar proves an archive was not altered in transit. It cannot say
      # where the archive came from — whoever produced the archive produced the sidecar,
      # so a substituted pair verifies perfectly. This attestation is signed by GitHub's
      # OIDC identity for this workflow and binds each file to this repository, this
      # workflow file and this commit, which is what `gh attestation verify` checks. npm
      # (`--provenance`) and PyPI (Trusted Publishing) already get the equivalent; the
      # release archives had nothing, and they are what the install scripts download.
      #
      # Sidecars are deliberately not attested: they are a checksum of an attested file.
      # The uncompressed binaries are listed by their exact platform names rather than a
      # wildcard, because they carry no extension on unix and any looser glob would sweep
      # up the sidecars beside them. They matter as much as the archives here: they are
      # what `devp update --install` downloads and runs.
      - name: Attest the release binaries
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/dev-prune-v*-linux-x64
            dist/dev-prune-v*-linux-arm64
            dist/dev-prune-v*-darwin-x64
            dist/dev-prune-v*-darwin-arm64

      # The release body is the changelog entry, not a generated commit list. The commit
      # list is still appended by `generate_release_notes` below, so nothing is lost —
      # but what a reader sees first is the prose that was written deliberately.
      - name: Build the release body from CHANGELOG.md
        run: sh scripts/changelog-section.sh "${{ steps.version.outputs.version }}" > release-body.md

      # GitHub renders the asset list directly under the body, and the assets are the
      # first thing a visitor reaches for — usually the wrong thing, because a raw
      # archive is an executable in a folder with no PATH entry, no `devp` alias and no
      # checksum verified. This footer sits between the changelog and that list and says
      # so, and names which archive belongs to whom, since "darwin-arm64" means nothing
      # to someone who just wants the Mac build.
      - name: Append the install guide to the release body
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The MSRV comes from Cargo.toml's `rust-version` — the single source of
          # truth — so this note can never disagree with what `cargo install` enforces.
          MSRV="$(sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml)"
          cat >> release-body.md <<EOF

          ---

          ## Which download do I want?

          **Most people want none of them.** The installers below verify the SHA-256
          sidecar, put the binary somewhere already on \`PATH\`, and create the \`devp\`
          alias — three things unzipping an archive does not do.

          | You are on | Run this |
          |---|---|
          | Windows (PowerShell) | \`iwr -useb https://devprune.vkrishna04.me/install.ps1 \| iex\` |
          | Windows (Command Prompt) | \`powershell -NoProfile -ExecutionPolicy Bypass -Command "iwr -useb https://devprune.vkrishna04.me/install.ps1 \| iex"\` |
          | macOS / Linux | \`curl -fsSL https://devprune.vkrishna04.me/install.sh \| sh\` |
          | Python tooling | \`uv tool install dev-prune==${VERSION}\` / \`pipx install dev-prune==${VERSION}\` |
          | Rust, no compile | \`cargo binstall dev-prune@${VERSION}\` |
          | Rust, from source | \`cargo install dev-prune --version ${VERSION}\` (needs Rust ${MSRV}+) |

          The PyPI packages contain these same binaries rather than downloading one
          afterwards, so they work behind a registry mirror and offline. \`cargo install\`
          is the only channel that compiles on your machine; \`cargo binstall\` reaches
          for the archives on this page instead.

          Full instructions: <https://devprune.vkrishna04.me/#install>

          ## The assets, then

          Take one only if you are packaging dev-prune yourself, air-gapping it, or
          pinning it into a container image.

          | Asset | For |
          |---|---|
          | \`dev-prune-v${VERSION}-windows-x64.zip\` | Windows on Intel/AMD — almost every Windows PC |
          | \`dev-prune-v${VERSION}-windows-arm64.zip\` | Windows on ARM — Surface Pro X, Snapdragon laptops, Windows in a Mac VM |
          | \`dev-prune-v${VERSION}-windows-x86.zip\` | 32-bit Windows — locked-down corporate images, older industrial machines |
          | \`dev-prune-v${VERSION}-darwin-arm64.tar.gz\` | Apple Silicon Macs — M1 and later |
          | \`dev-prune-v${VERSION}-darwin-x64.tar.gz\` | Intel Macs — 2020 and earlier |
          | \`dev-prune-v${VERSION}-linux-x64.tar.gz\` | Linux on Intel/AMD |
          | \`dev-prune-v${VERSION}-linux-arm64.tar.gz\` | Linux on ARM — Raspberry Pi 4/5, Graviton, ARM CI runners |

          Both Linux builds are statically linked against musl, so they run on any
          distribution including Alpine, with no glibc floor.

          32-bit is published for Windows only. There is no 32-bit Linux, no 32-bit
          macOS and no 32-bit ARM build on any platform; the install scripts refuse
          rather than guess when they meet one.

          There is no \`.vsix\` on this page. The VS Code extension has its own
          version and its own release cadence, so it ships from its own tags:
          [the extension's releases](https://github.com/${{ github.repository }}/releases?q=vscode-v&expanded=true).
          Install it by name instead — **VKrishna04.dev-prune**, on the
          [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=VKrishna04.dev-prune)
          and on [Open VSX](https://open-vsx.org/extension/VKrishna04/dev-prune).

          **Windows: the binaries are not code-signed**, and two separate features react
          to that.

          \`Windows protected your PC\` is SmartScreen, and it only challenges files
          carrying a Mark of the Web — which your browser attaches to the download and
          File Explorer copies onto everything it extracts. Clear the mark on the archive
          before extracting and nothing inside it is ever marked:

          \`\`\`powershell
          Unblock-File .\\dev-prune-v${VERSION}-windows-x64.zip
          \`\`\`

          The installers above already do this for you, on the archive and on both
          installed copies.

          A refusal with **no dialog and no "run anyway"** is something else: Smart App
          Control, which blocks unsigned executables outright and never looks at the mark.
          It is on by default on clean installs of Windows 11 22H2+ and always off on
          upgraded ones, which is why the same release runs on one machine and not the
          next. \`Unblock-File\` does not help, and neither does building from source.
          [The troubleshooting guide](https://devprune.vkrishna04.me/docs/troubleshooting)
          covers what your options actually are.

          Every archive ships a \`.sha256\` sidecar. Check it before you trust it:

          \`\`\`bash
          sha256sum -c dev-prune-v${VERSION}-linux-x64.tar.gz.sha256
          \`\`\`

          \`\`\`powershell
          (Get-FileHash dev-prune-v${VERSION}-windows-x64.zip).Hash -eq (Get-Content dev-prune-v${VERSION}-windows-x64.zip.sha256).Split(' ')[0].ToUpper()
          \`\`\`

          An archive's hash stops meaning anything the moment you unpack it, and the
          unpacked files are the only ones your antivirus ever looks at. So each Windows
          zip also ships a \`.zip.contents.sha256\` listing the digest of every file inside
          it — run this in the folder you extracted to, from Git Bash (\`sha256sum\` ships
          with Git for Windows, and is what reads this format):

          \`\`\`bash
          sha256sum -c dev-prune-v${VERSION}-windows-x64.zip.contents.sha256
          \`\`\`

          \`dev-prune.exe\` and \`devp.exe\` are one file under two names and share a digest
          on purpose, so a scanner builds one reputation record instead of two.
          \`devpw.exe\` — the console-free build the scheduled task runs — is compiled
          separately and legitimately has a different one. \`devp trust\` prints the same
          three digests for the copies already installed on your machine, so you can
          compare them against this file without downloading anything again.

          That sidecar proves the file was not altered in transit. It does not prove
          where it came from — the same hand that swaps an archive swaps its sidecar.
          Every archive on this page is also signed by GitHub's build provenance, which
          binds it to this repository, this workflow and the commit it was built from:

          \`\`\`bash
          gh attestation verify dev-prune-v${VERSION}-linux-x64.tar.gz --repo ${{ github.repository }}
          \`\`\`

          \`\`\`powershell
          gh attestation verify dev-prune-v${VERSION}-windows-x64.zip --repo ${{ github.repository }}
          \`\`\`
          EOF

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          body_path: release-body.md
          generate_release_notes: true
          fail_on_unmatched_files: true

  # npm carries the binaries themselves, not a postinstall downloader. Eight packages go
  # out: seven platform packages holding that platform's executables — one on Unix, three
  # on Windows since `devpw.exe` shipped — marked with `os`/`cpu` so npm resolves exactly
  # one of them, and the `dev-prune` dispatcher that lists all seven
  # as optionalDependencies. A postinstall download would break `npm ci --ignore-scripts`,
  # offline installs and every locked-down CI runner; this layout does not.
  #
  # Order matters and is not an optimisation: the dispatcher is published last, because
  # the moment it exists npm will try to resolve its optionalDependencies, and a version
  # that is not on the registry yet resolves to nothing.
  # Gated on a repository variable, not on the presence of the secret. The `secrets`
  # context is not available in a job-level `if:`, so a secret check can only happen
  # inside a step — and a step that returns early still paints the job green. The first
  # release of this project reported "Publish to npm: success" while publishing nothing,
  # because that is exactly what an early `exit 0` looks like from the outside.
  #
  # NPM_PUBLISH is "true": all eight names exist on the registry and each has a trusted
  # publisher pointing at this workflow. Setting it back to "false" reports `skipped`,
  # which is a different word in the UI and in the API from a job that ran and published
  # nothing. See docs/RELEASING.md.
  publish-npm:
    name: Publish to npm
    needs: publish
    runs-on: ubuntu-latest
    if: vars.NPM_PUBLISH == 'true'
    outputs:
      # Empty unless some package name does not exist on the registry yet, in which case
      # the release is a partial one and the summary says so instead of a bare tick.
      missing: ${{ steps.npm.outputs.missing }}
    permissions:
      contents: read
      # Required by `npm publish --provenance`: npm exchanges this token for a signed
      # attestation tying the tarball to this workflow, this commit and this tag.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The npm bundled with a Node release is whatever shipped the day that Node was
      # cut. Exchanging the OIDC token for a publish credential needs npm 11.5.1 or
      # newer, and a job that is one Node patch away from silently losing its
      # authentication is not a job anyone will think to look at.
      - name: Use the current npm
        run: npm install -g npm@latest

      - name: Build the packages from the release assets
        run: sh scripts/npm-prepare.sh "${{ needs.publish.outputs.version }}" dist npm-dist

      # Trusted publishing cannot create a name. A trusted publisher is configured on a
      # package, so a package with no versions has nowhere to hold one, and npm answers
      # the attempt with a bare `E404 ... PUT` that reads like a network fault. See
      # https://github.com/npm/cli/issues/8544, open since September 2025.
      #
      # This used to abort the release. It reports instead: the npm channel has spent
      # real releases with some names published and some held by the registry's
      # new-package spam heuristic, and refusing to ship the ones that work helps nobody.
      # `npm-publish.sh` skips a name it cannot create; this step is here so the missing
      # ones are named once, up front, instead of being found scattered through the log.
      - name: Which package names already exist
        run: |
          set -eu
          missing=""
          for dir in npm-dist/*/; do
            pkg=$(basename "$dir")
            npm view "$pkg" version >/dev/null 2>&1 || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Not on the registry:$missing. These will be skipped, so this is a partial npm release. Publish each one once from a workstation with \`npm login\` (\`sh scripts/npm-publish.sh <version> npm-dist latest --local\`), then add a trusted publisher for it (GitHub Actions, Life-Experimentalist/dev-prune, release.yml)."
          fi

      # A prerelease published as `latest` becomes what every `npm install dev-prune`
      # gets. Tags with a `-` go out under `next` instead, which is what the dist-tag
      # exists for.
      - name: Choose the dist-tag
        id: tag
        run: |
          version="${{ needs.publish.outputs.version }}"
          case "$version" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      # No token, by design. The `id-token: write` above is the whole credential: npm
      # exchanges it for a short-lived publish grant and for the provenance attestation
      # in the same step, so there is nothing in this repository's secrets for anyone to
      # steal and nothing to rotate.
      - name: npm publish
        id: npm
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          DIST_TAG: ${{ steps.tag.outputs.dist_tag }}
          NPM_MISSING_FILE: ${{ runner.temp }}/npm-missing.txt
        run: |
          set -eu
          # The loop lives in the script so CI can dry-run this exact command. See the
          # "Dry-run the publish that release.yml will run" step in ci.yml.
          if ! sh scripts/npm-publish.sh "$VERSION" npm-dist "$DIST_TAG"; then
            echo "::error::npm publish failed. An E404 on the PUT for a name that exists means that package has no trusted publisher for this workflow — add one under the package's Settings on npmjs.com."
            exit 1
          fi
          # Read by the summary job, so the channel report can say "partial" rather than
          # a green tick that hides three missing Windows packages.
          if [ -s "$NPM_MISSING_FILE" ]; then
            echo "missing=$(cat "$NPM_MISSING_FILE")" >> "$GITHUB_OUTPUT"
          fi

  # PyPI, for `uv tool install dev-prune`, `uvx dev-prune` and `pipx run dev-prune`.
  # Nothing about dev-prune is Python; PyPI is simply where those three installers look,
  # and each wheel is a zip holding one prebuilt executable. uv and ruff ship themselves
  # exactly this way.
  #
  # Gated on a repository variable rather than on a secret, because Trusted Publishing
  # uses no secret — there would be nothing to test for. Set PYPI_PUBLISH to "true" in
  # the repository variables once the PyPI side is configured; see docs/RELEASING.md.
  publish-pypi:
    name: Publish to PyPI
    needs: publish
    runs-on: ubuntu-latest
    if: vars.PYPI_PUBLISH == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/dev-prune
    permissions:
      contents: read
      # Trusted Publishing: PyPI accepts this short-lived OIDC token in place of an API
      # token, so no long-lived credential has to exist anywhere. The binding on the
      # PyPI side names this workflow file and this environment, so both are fixed.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Deliberately into a directory of its own: the action uploads everything in the
      # target directory, and `dist/` is full of tarballs and zips that are not wheels.
      - name: Build the wheels from the release assets
        run: python scripts/build_wheels.py "${{ needs.publish.outputs.version }}" dist wheels

      # The METADATA in these wheels is written by hand — there is no build backend to
      # get it right. PyPI validates on upload, but by then the GitHub release exists and
      # the tag is public, so a rejected wheel means a version number burned for a typo.
      - name: Check the wheel metadata before uploading it
        run: pipx run twine check wheels/*.whl

      # Pinned to a tag, not the `release/v1` branch the examples use. That branch is a
      # moving pointer into a workflow that holds an OIDC identity able to publish to
      # PyPI, and the action's own README says to pin rather than track it. Dependabot
      # bumps this line; a branch pointer is a change nobody reviews.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: wheels
          # Same reasoning as the `npm view` check in publish-npm: re-running a release
          # after fixing one failed channel is normal, and without this the second run
          # dies on "File already exists" for wheels the first run uploaded. There are
          # seven wheels here, so a partial upload is a real state to recover from.
          skip-existing: true

  # crates.io is published only after every platform built and the release exists, so a
  # failed build never leaves an unyankable version behind.
  #
  # The prerelease gate reads the *tag*, not `github.ref_name`. On a `workflow_dispatch`
  # run `ref_name` is the branch the workflow was launched from — `main`, which contains
  # no `-` — so gating on it would push `v1.0.0-rc1` to crates.io as a real release.
  # A crates.io version cannot be deleted, only yanked.
  publish-crate:
    name: Publish to crates.io
    needs: publish
    runs-on: ubuntu-latest
    # Two gates, both job-level so a channel that does not run says `skipped` rather
    # than `success`. See the note on publish-npm for why the secret cannot be one of
    # them.
    if: ${{ vars.CRATES_PUBLISH == 'true' && !contains(github.event.inputs.tag || github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the tag being released, not the default branch. A dispatch run
          # would otherwise publish whatever is on `main` under the tag's name.
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08
        with:
          toolchain: stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -eu
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CRATES_PUBLISH is 'true' but the CARGO_REGISTRY_TOKEN secret is empty or unset."
            exit 1
          fi

          # The npm and PyPI jobs both tolerate a version that is already on their
          # registry, because re-running a release after fixing one failed channel is
          # normal. This job did not, and it is the one where that hurts most: a second
          # run would die on "crate version already uploaded" and paint the whole
          # release red for having already succeeded. crates.io needs a descriptive
          # User-Agent or it answers 403 to everything, which would look like "not
          # published" and re-publish into the same error.
          ua="dev-prune-release/${VERSION} (https://github.com/Life-Experimentalist/dev-prune)"
          if curl -sfL -A "$ua" "https://crates.io/api/v1/crates/dev-prune/${VERSION}" >/dev/null; then
            echo "dev-prune ${VERSION} is already on crates.io — skipping."
            exit 0
          fi

          cargo publish --locked

  # The first release of this project finished with three green jobs and nothing on any
  # registry, and there was no single place that said so. This job is that place: it runs
  # whatever happened above and turns each channel's result into a sentence on the run
  # summary page. `skipped` is reported as "not published" in words, because the failure
  # this guards against is not a job going red — it is a human reading green and stopping.
  # Homebrew, Scoop and WinGet are all "a URL, a SHA-256 and a version" in three
  # different syntaxes, and all three are wrong the moment a release ships without them
  # being regenerated. Nobody notices, because a stale manifest installs perfectly — it
  # just installs the previous version, silently, for as long as it takes someone to
  # report it. So this runs from the release itself, reads the sidecars that were just
  # attested, and commits the result to `main`.
  #
  # It does not open the `winget-pkgs` pull request: that submission is reviewed by a
  # human at Microsoft and needs an account and a fork, so the manifests are rendered
  # ready to copy and the PR stays a deliberate act. Same for a tap or bucket repository
  # — see docs/RELEASING.md.
  packaging:
    name: Refresh packaging manifests
    needs: publish
    runs-on: ubuntu-latest
    # A pre-release must not move the manifests: `brew install` and `scoop install` have
    # no notion of a release channel, so an rc tag would hand every user a pre-release.
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # `main`, not the tag: a tag checkout is detached and has nowhere to push.
          ref: main

      - name: Render from the published sidecars
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: sh scripts/render-packaging.sh "$VERSION"

      - name: Commit if anything changed
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -eu
          # Staged first, then compared: on the release that introduces a manifest the
          # files are untracked, and `git diff` does not see untracked files at all — the
          # job reported "nothing changed" and pushed nothing.
          git add -A packaging
          if git diff --cached --quiet -- packaging; then
            echo "Manifests already describe v${VERSION}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Packaging manifests for v${VERSION}"
          git push origin main


  # WinGet is the one channel where publishing means opening a pull request against
  # somebody else's repository, and a person at Microsoft merges it. `wingetcreate` does
  # the fork, the branch, the commit and the PR from a PAT, so the part that needs a human
  # is the review and not the copying — which matters because the copying is what went
  # wrong the first time: three files moved by hand, with two encoding rules and a header
  # rule written down as prose in RELEASING.md for a person to remember.
  #
  # Gated on a repository variable for the same reason as npm: a step that returns early
  # paints the job green, and "submitted" is not something to be wrong about. Set
  # WINGET_PUBLISH to "true" once WINGET_TOKEN exists — a classic PAT with `public_repo`,
  # belonging to the account that owns the winget-pkgs fork. Until then this reports
  # `skipped`.
  #
  # Windows, because `wingetcreate` is a Windows binary; `sh` is git-bash, which every
  # windows runner has.
  submit-winget:
    name: Submit to winget-pkgs
    needs: publish
    runs-on: windows-latest
    # Same rule as the manifest refresh: a pre-release must never become a winget-pkgs
    # version, because `winget install` has no notion of a channel.
    if: ${{ vars.WINGET_PUBLISH == 'true' && !contains(github.event.inputs.tag || github.ref_name, '-') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Rendered here rather than taken from the `packaging` job's commit: the two jobs
      # run in parallel, and a submission that depends on a push having landed is a race
      # that fails once a year and is impossible to reproduce.
      - name: Render the manifests from the published sidecars
        shell: bash
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: sh scripts/render-packaging.sh "$VERSION"

      # The licence header comes off and the BOM goes on. Same script a maintainer runs
      # by hand, so a submission from CI and a submission from a laptop are byte-identical.
      - name: Prepare the submission copies
        shell: bash
        run: sh scripts/winget-manifests.sh winget-submission

      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest `
            -OutFile "$env:RUNNER_TEMP\wingetcreate.exe"

      # `submit` rather than `update`: `update` rewrites a manifest already in the
      # catalog, and this package's first version is still an open pull request. `submit`
      # validates the manifests against the schema before it opens anything, so a broken
      # render fails here rather than in front of a reviewer.
      #
      # The token goes in via WINGET_CREATE_GITHUB_TOKEN and not `--token`, because
      # winget-create's own documentation warns that the flag "may result in the token
      # being logged" — it is a command line, and command lines end up in traces.
      # `--no-open` because the default is to open the pull request in a browser, and a
      # runner has none.
      - name: wingetcreate submit
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) {
            Write-Error "WINGET_PUBLISH is true but WINGET_TOKEN is not set."
            exit 1
          }
          & "$env:RUNNER_TEMP\wingetcreate.exe" submit `
            --no-open `
            --prtitle "New version: VKrishna04.dev-prune version $env:VERSION" `
            winget-submission
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  summary:
    name: What actually shipped
    needs: [publish, publish-npm, publish-pypi, publish-crate, packaging, submit-winget]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write the channel report
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          NPM: ${{ needs.publish-npm.result }}
          NPM_MISSING: ${{ needs.publish-npm.outputs.missing }}
          PYPI: ${{ needs.publish-pypi.result }}
          CRATE: ${{ needs.publish-crate.result }}
          PKG: ${{ needs.packaging.result }}
          WINGET: ${{ needs.submit-winget.result }}
        run: |
          set -eu
          describe() {
            case "$1" in
              success)  echo "✅ published" ;;
              skipped)  echo "⚠️ **not published** — channel not enabled (set \`$2\`)" ;;
              failure)  echo "❌ **failed** — see the job log" ;;
              *)        echo "❔ $1" ;;
            esac
          }
          {
            echo "## dev-prune v${VERSION}"
            echo
            echo "| Channel | Result |"
            echo "|---|---|"
            echo "| GitHub release | ✅ published |"
            # A partial npm release is a success with a caveat: the names that exist
            # were published, the ones the registry has not created yet were skipped.
            if [ "$NPM" = success ] && [ -n "${NPM_MISSING:-}" ]; then
              echo "| npm | ⚠️ **partially published** — no registry entry yet for:$NPM_MISSING |"
            else
              echo "| npm | $(describe "$NPM" NPM_PUBLISH) |"
            fi
            echo "| PyPI | $(describe "$PYPI" PYPI_PUBLISH) |"
            echo "| crates.io | $(describe "$CRATE" CRATES_PUBLISH) |"
            # The VS Code extension is not a channel of this release. It has its own
            # tags, its own release page and its own workflow, and naming it here with
            # any word at all — including "skipped" — would send someone to look for a
            # job that was never supposed to run.
            echo "| VS Code extension | — released separately, see \`release-extension.yml\` |"
            # Not `describe`: "channel not enabled" is the wrong story here — a
            # skip means the tag was a pre-release, which is the correct outcome.
            case "$PKG" in
              success) echo "| Homebrew/Scoop/WinGet manifests | ✅ refreshed on \`main\` |" ;;
              skipped) echo "| Homebrew/Scoop/WinGet manifests | ⚠️ skipped — pre-release tags never move the manifests |" ;;
              *)       echo "| Homebrew/Scoop/WinGet manifests | ❌ **failed** — see the job log |" ;;
            esac
            # Submitting is not publishing: a merged pull request is what makes
            # `winget install` resolve, and that is a person at Microsoft, not this job.
            case "$WINGET" in
              success) echo "| winget-pkgs | ✅ pull request opened — merging is a Microsoft review |" ;;
              skipped) echo "| winget-pkgs | ⚠️ **not submitted** — channel not enabled (set \`WINGET_PUBLISH\`) |" ;;
              *)       echo "| winget-pkgs | ❌ **failed** — see the job log |" ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

          # A release where every registry sat out is almost always a misconfiguration
          # rather than an intent, and it is the one outcome that must not look clean.
          if [ "$NPM" != "success" ] && [ "$PYPI" != "success" ] && [ "$CRATE" != "success" ]; then
            echo "::warning::v${VERSION} reached the GitHub release only. No package registry received it."
          fi
