name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR supersedes the previous run. Pushes to main are
# never cancelled — every commit on the default branch keeps its full result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The suite must never touch the machine it runs on. Individual tests set this too,
  # but a runner that installs a scheduled task and repoints global core.hooksPath is
  # a bad enough outcome to be worth belt and braces.
  DEV_PRUNE_NO_AUTO_SETUP: "1"

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Several tests shell out to `git init`; a runner without a configured identity
      # still inits fine, but set one so any future test that commits does not hang.
      - name: Configure a git identity for the test repos
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "dev-prune CI"

      - name: Check formatting
        run: cargo fmt --all -- --check

      # `--all-targets` also lints tests and benches. Without it, warnings in test
      # code pass CI and only surface locally.
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all --all-features

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain under test is whatever `rust-version` in Cargo.toml says, read
      # here rather than pinned, so bumping the MSRV is a one-line change and this job
      # follows. That field is the single source of truth; the docs that restate it are
      # checked against it below in the docs job.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "msrv=$(sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Cargo.toml advertises the MSRV; nothing enforced it, so a stable-only API could
      # land and silently break every user pinned to it.
      - name: Build against the declared MSRV
        run: cargo check --locked --all-targets --all-features

  # Five of the seven release targets are native builds on their own runner, and the test
  # matrix already proves those compile. The two Windows cross-compiles are the
  # exception, and `ring` — the crypto backend under the release check's HTTPS client —
  # is why: it builds C and assembly, so each needs the matching MSVC toolset rather than
  # just a rustup target. Nothing else here would notice if either broke, and the first
  # run would otherwise be the release itself, after the tag exists.
  #
  # `check` rather than `build`: it still runs ring's build script and compiles its
  # native code, which is the part that can fail, without linking six crates' worth of
  # release codegen on every push.
  cross:
    name: Cross-compile (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-pc-windows-msvc, i686-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Check the target
        run: cargo check --locked --target ${{ matrix.target }}

  package:
    name: Publishable crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `cargo package` applies the `include` allowlist in Cargo.toml and then *compiles*
      # the resulting tarball. That second half is the point: the binary embeds SKILL.md,
      # the JSON schema and the MIME icons with `include_bytes!`/`include_str!`, so a file
      # missing from the allowlist is not a runtime bug — it is a crate that does not
      # build for anyone who installs it, fixable only by publishing a new version.
      # Nothing else in this workflow looks at the packaged file list.
      - name: Package and compile the crate as it would be published
        run: cargo package --locked

      # crates.io rejects anything over 10 MiB. Catching that here beats finding out
      # during the release job, after the git tag already exists.
      - name: Assert the packaged crate fits under the crates.io limit
        run: |
          crate="$(ls target/package/*.crate)"
          size="$(stat -c %s "$crate")"
          echo "$crate is $size bytes"
          if [ "$size" -gt 10485760 ]; then
            echo "::error::$crate is $size bytes, over the 10 MiB (10485760) crates.io limit."
            exit 1
          fi

  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The release workflow builds the GitHub release body out of this section and
      # fails without it. Checking on every push means the answer to "can we tag?" is
      # already known, instead of being discovered after the tag exists — and a tag
      # cannot be moved once anyone has fetched it.
      - name: CHANGELOG.md documents the version in Cargo.toml
        run: |
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          echo "Cargo.toml version: $version"
          sh scripts/changelog-section.sh "$version" > /dev/null
          echo "CHANGELOG.md has a section for $version."

  packaging:
    name: npm and PyPI packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # The packaging scripts only ever run during a release, so without this their
      # first execution is also the first time anyone finds out they are broken — after
      # the tag exists and six builds have already run. Stand-in binaries are enough:
      # what is under test is the archive handling, the generated manifests and the
      # wheel layout, none of which care what the bytes are.
      - name: Fabricate a set of release assets
        run: |
          mkdir -p fake/assets
          printf 'not a real binary' > fake/dev-prune
          printf 'not a real binary' > fake/dev-prune.exe
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            tar -czf "fake/assets/dev-prune-v9.9.9-$t.tar.gz" -C fake dev-prune
          done
          for t in windows-x64 windows-arm64 windows-x86; do
            (cd fake && zip -q "assets/dev-prune-v9.9.9-$t.zip" dev-prune.exe)
          done
          ls fake/assets

      - name: Build the npm packages
        run: sh scripts/npm-prepare.sh 9.9.9 fake/assets fake/npm

      # `npm pack --dry-run` applies the same manifest validation as `npm publish`, so a
      # malformed `os`/`cpu` field or unparseable JSON fails here rather than partway
      # through publishing eight packages.
      - name: Validate every generated manifest
        run: |
          for dir in fake/npm/*/; do
            echo "--- $dir"
            npm pack --dry-run --pack-destination /tmp "$dir"
          done

      # `npm pack` above proves the manifests are valid; this proves the publish
      # invocation itself is. They are not the same check — the first v1.0.0 release
      # packed cleanly here and then failed in release.yml on the publish argument,
      # because nothing in CI ever ran the publish command. This runs the very script
      # release.yml runs, so the two cannot drift again.
      - name: Dry-run the publish that release.yml will run
        run: sh scripts/npm-publish.sh 9.9.9 fake/npm latest --dry-run

      - name: Build the wheels
        run: python scripts/build_wheels.py 9.9.9 fake/assets fake/wheels

      # The same metadata check PyPI runs on upload.
      - name: twine check
        run: |
          pip install --quiet twine
          twine check fake/wheels/*.whl

      # A wheel that installs but leaves out `devp` would ship a product where half the
      # documentation refers to a command that does not exist.
      - name: A wheel installs both executables
        run: |
          python -m venv fake/venv
          fake/venv/bin/python -m pip install --quiet --no-index \
            fake/wheels/dev_prune-9.9.9-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.musllinux_1_2_x86_64.whl
          test -x fake/venv/bin/dev-prune
          test -x fake/venv/bin/devp
          echo "dev-prune and devp both installed and executable."

  # `cargo audit` is invoked directly rather than through rustsec/audit-check. That
  # action's newest release still declares `runs.using: node20`, and GitHub removes the
  # Node 20 runtime from the runners on 2026-09-16; the fix exists on the action's main
  # branch but has never been tagged. Calling the tool takes two lines, puts no
  # third-party action in the path of a job that holds a token, and cannot rot this way
  # again — `cargo audit` is the thing the action was wrapping.
  audit:
    name: Dependency advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Caches $CARGO_HOME/bin as well as the build, so cargo-audit is compiled once
      # rather than on every push.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: audit
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Check the dependency tree against the RustSec advisory database
        run: cargo audit

  scripts:
    name: Installer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The install scripts are the first thing anyone runs; a syntax error in them is
      # a broken product regardless of how green the Rust build is.
      - name: shellcheck install.sh
        run: shellcheck --shell=sh scripts/install.sh
      - name: shellcheck changelog-section.sh
        run: shellcheck --shell=sh scripts/changelog-section.sh
      - name: shellcheck check-msrv.sh
        run: shellcheck --shell=sh scripts/check-msrv.sh
      - name: shellcheck check-schema.sh
        run: shellcheck --shell=sh scripts/check-schema.sh
      - name: shellcheck winget-manifests.sh
        run: shellcheck --shell=sh scripts/winget-manifests.sh
      - name: shellcheck npm-prepare.sh
        run: shellcheck --shell=sh scripts/npm-prepare.sh
      - name: shellcheck npm-publish.sh
        run: shellcheck --shell=sh scripts/npm-publish.sh
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

  docs:
    name: Diagram syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # A malformed diagram renders as a red error box on GitHub and nothing else
      # notices. Parsing them here is the only thing that catches it.
      - name: Parse every mermaid block
        run: |
          npm install --no-save --no-package-lock mermaid@11 jsdom
          node scripts/check-mermaid.mjs README.md docs/*.md docs/*/*.md \
            wiki/*.md .agents/skills/dev-prune/SKILL.md
      # Markdown cannot read Cargo.toml, so the docs that restate the MSRV are checked
      # against `rust-version` instead of trusted to keep up with it.
      - name: Docs agree with Cargo.toml's rust-version
        run: sh scripts/check-msrv.sh

      # Same problem, different number: the install scripts' offline fallback and the
      # site's version banner are both written by hand and both fail silently.
      - name: The install scripts and site agree with Cargo.toml's version
        run: sh scripts/check-version.sh

      # The config schema is embedded in the binary, bundled in the VS Code extension and
      # published at the URL both every `.devprune.json` and the SchemaStore catalog point
      # at. The sync scripts that regenerate the copies run at build and packaging time,
      # which is after the commit — so without this a schema change merges with two stale
      # copies, and JetBrains, Neovim and Zed keep validating against the old one.
      - name: Every copy of the config schema is the same file
        run: sh scripts/check-schema.sh

  site:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
