#
# The GitHub wiki is a separate git repository (<repo>.wiki.git) with no PR flow and
# no CI, so anything living only there rots invisibly. Instead the wiki's pages live
# in wiki/ in the main repository — reviewed and versioned like everything else — and
# this workflow mirrors them out on every change. Editing the wiki through the web UI
# is pointless: the next sync overwrites it, which is exactly the guarantee we want.
#
# One-time prerequisite: the wiki git repository does not exist until the very first
# page is created by hand in the web UI ("Create the first page" on the Wiki tab).
# Until then the clone below fails, and the error message says so.

name: Sync wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clone the wiki repository
        run: |
          if ! git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git" wiki-checkout; then
            echo "::error::The wiki repository does not exist yet. Open the Wiki tab on GitHub, click 'Create the first page', save it once (any content — the next sync overwrites it), then re-run this workflow."
            exit 1
          fi

      - name: Mirror wiki/ into it
        run: |
          find wiki-checkout -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r wiki/. wiki-checkout/

      - name: Commit and push
        working-directory: wiki-checkout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "Sync from wiki/ at ${{ github.sha }}"
          # Force, because this really is a mirror: a web-UI edit on the wiki
          # side makes the wiki repository non-fast-forward, and the promise
          # above is that the next sync overwrites it — not that it fails.
          git push --force
