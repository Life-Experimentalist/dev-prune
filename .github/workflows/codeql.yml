name: CodeQL

# `cargo audit` answers "is a dependency of ours known-vulnerable". It says nothing about
# the code in this repository. CodeQL is the other half: it reads the source itself and
# reports the classes of bug an advisory database cannot know about.
#
# It also scans the workflows in `.github/workflows`, which is the part of this repository
# with the most privilege and the least test coverage — a release job holds a PyPI
# identity, a crates.io token and `contents: write`, and nothing else looks at it.
#
# Free on public repositories, permanently, with no third-party app installed and no
# access granted to anyone. Findings land in the repository's Security tab, and Copilot
# Autofix proposes a patch on each one, so an alert arrives with a diff attached rather
# than as a chore.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, on a fixed offset. The value of a scheduled run is not that the code changed
    # — it did not — it is that CodeQL's own queries did. A rule written next month finds
    # things in code that has sat untouched since today.
    - cron: "41 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole point: without this the analysis runs and the results are discarded.
      security-events: write
    strategy:
      # One language failing must not hide the other's findings.
      fail-fast: false
      matrix:
        language: [rust, actions]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # `none` analyses the source directly instead of watching a compile. For a crate
          # this size the tracing build buys nothing and costs a full `cargo build` on
          # every push, including the scheduled ones.
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
