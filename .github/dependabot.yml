version: 2
updates:
  # The crate itself. Grouped so a routine dependency bump is one PR, not eight.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  # The landing site.
  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      site-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(site)"

  # /npm is deliberately absent: the wrapper package has no dependencies to update.

  # Pinned action versions in the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
