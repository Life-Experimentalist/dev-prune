version: 2
updates:
  # The crate itself. Grouped so a routine dependency bump is one PR, not eight.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # `direct` is the default, and it is the wrong default for a binary crate that
    # commits `Cargo.lock` and builds releases with `--locked`. What ships is the
    # lockfile's resolution, transitive crates included, and Dependabot never touched
    # those: the lock drifted twenty-odd crates behind — `rustls-webpki` among them —
    # while every manifest constraint was current and every Dependabot run was green.
    # `all` covers the dependencies of direct dependencies too, so the file that
    # decides the shipped binary is the file being kept fresh.
    allow:
      - dependency-type: all
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  # The landing site. Weekly, not monthly: grouping already collapses a routine month
  # into one PR, so the slower schedule bought no quiet — it only meant the site sat on
  # known-old direct dependencies for up to four weeks at a time.
  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      site-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(site)"

  # /npm is deliberately absent: the wrapper package has no dependencies to update.

  # Pinned action versions in the workflows.
  #
  # Weekly, not monthly. Actions rot in a way crate dependencies do not: GitHub retires
  # the Node runtime an action declares, and every action still on the old one stops
  # working on a date announced months earlier. Monthly checks are how a workflow ends
  # up three majors behind without anyone deciding that.
  #
  # Dependabot only sees the `uses:` lines. It does NOT see `node-version:`,
  # `python-version:` or the `runs-on:` labels — those are plain strings to it, so
  # the runtime pins need a human on a calendar rather than a bot.
  #
  # `dtolnay/rust-toolchain` was the trap in between. The MSRV job used to pin it at
  # `@1.85.0`, which *looks* like a pinned action version and Dependabot treated it as
  # one — but the version was the MSRV the job exists to prove, so "upgrading" it
  # deleted the test rather than updating it. Dependabot opened exactly that PR
  # (1.85.0 -> 1.100.0) within an hour of this file landing. The job now reads the
  # toolchain from Cargo.toml's `rust-version` instead of a pin, but the ignore below
  # stays: the action's remaining refs (`@stable`, `@master`) are channels, not
  # versions, and there is still nothing there a bot should be bumping.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Raising the MSRV is a decision recorded in Cargo.toml's `rust-version`, and
      # this pin follows that. It is never the other way round.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      # Patch and minor bumps of actions are noise individually and meaningful in bulk.
      # Majors stay ungrouped: for an action, a major is usually a runtime change, and
      # that is exactly the PR that deserves to be read on its own.
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"
